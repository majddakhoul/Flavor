<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
:root[data-theme="light"]{--primary:#ea580c;--primary-dark:#c2410c;--secondary:#0d9488;
  --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--text:#0f172a;--text2:#64748b;--border:#e2e8f0}
:root[data-theme="dark"]{--primary:#fb923c;--primary-dark:#fdba74;--secondary:#2dd4bf;
  --bg:#0f172a;--surface:#111827;--surface2:#1e293b;--text:#f8fafc;--text2:#94a3b8;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
aside{width:270px;background:var(--surface);border-right:1px solid var(--border);
  padding:20px 0;position:fixed;height:100vh;overflow-y:auto}
aside h2{font-size:14px;padding:0 20px 16px;border-bottom:1px solid var(--border)}
.grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--text2);
  padding:16px 20px 6px;font-weight:600}
.tab{display:block;width:calc(100% - 20px);margin:2px 10px;padding:9px 14px;text-align:left;
  border:0;background:transparent;color:var(--text2);border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:12.5px}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--primary);color:#fff;font-weight:600}
main{margin-left:270px;flex:1;padding:24px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h1{font-size:20px}
.ctl{display:flex;gap:8px}
button.act{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);padding:9px 14px;font-size:13px}
button.act:hover{border-color:var(--primary);color:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.viewport{overflow:auto;border:1px solid var(--border);border-radius:10px;
  background:var(--surface2);padding:18px;max-height:80vh}
.viewport svg{max-width:none!important;height:auto}
</style>
</head>

 "act-security": "flowchart TD\n    classDef start fill:#0d9488,stroke:#0d9488,color:#ffffff\n    classDef act fill:#eff6ff,stroke:#2563eb,color:#0f172a\n    classDef dec fill:#fef3c7,stroke:#d97706,color:#0f172a\n    classDef sys fill:#f0fdfa,stroke:#0d9488,color:#0f172a\n    classDef stop fill:#64748b,stroke:#475569,color:#ffffff\n    classDef bad fill:#fee2e2,stroke:#dc2626,color:#0f172a\n\n    A([Start]):::start --> B[\"Guest arrives at entrance\"]:::act\n    B --> C{Has a reservation code?}:::dec\n    C -->|Yes| D[\"Verify reservation_code\"]:::sys\n    C -->|No| E[\"Check walk-in availability with waiter\"]:::act\n    D --> F{Customer is banned?}:::dec\n    E --> F\n    F -->|Yes| G[\"Deny entry, escalate to manager\"]:::bad\n    F -->|No| H{party_size fits table capacity?}:::dec\n    H -->|No| I[\"Ask waiter for a larger table\"]:::act\n    H -->|Yes| J[\"Allow entry\"]:::act\n    I --> J\n    G --> K([End]):::stop\n    J --> K\n", "act-customer": "flowchart TD\n    classDef start fill:#0d9488,stroke:#0d9488,color:#ffffff\n    classDef act fill:#eff6ff,stroke:#2563eb,color:#0f172a\n    classDef dec fill:#fef3c7,stroke:#d97706,color:#0f172a\n    classDef sys fill:#f0fdfa,stroke:#0d9488,color:#0f172a\n    classDef stop fill:#64748b,stroke:#475569,color:#ffffff\n    classDef bad fill:#fee2e2,stroke:#dc2626,color:#0f172a\n\n    A([Start]):::start --> B[\"Browse menu and active offers\"]:::act\n    B --> C{Dine in or delivery / takeaway?}:::dec\n    C -->|Dine in| D[\"Check table availability, book reservation\"]:::act\n    C -->|Delivery / takeaway| E[\"Add meals and offers to the order\"]:::act\n    D --> F[\"Arrive, get seated by waiter\"]:::act\n    E --> G[\"Submit order (order_type set)\"]:::act\n    F --> H[\"Order opened at the table\"]:::act\n    G --> I[\"Track order status\"]:::sys\n    H --> I\n    I --> J{Order Completed?}:::dec\n    J -->|Not yet| I\n    J -->|Yes| K[\"Rate the meal and the offer\"]:::act\n    K --> L([End]):::stop\n", "act-guest": "  offer lines added to the order\"]:::act\n    M --> N\n    N --> O[\"Chef checks ingredient stock and prepares\"]:::act\n    O --> P{Ingredients short?}:::dec\n    P -->|Yes| Q[\"Meal marked unavailable, manager notified\"]:::bad\n    P -->|No| R[\"Order marked Confirmed\"]:::act\n    Q --> R\n\n    R --> S{Delivery order?}:::dec\n    S -->|Yes| T[\"Delivery employee delivers, marks Completed\"]:::act\n    S -->|No| U[\"Waiter serves, marks order Completed\"]:::act\n\n    T --> V[\"Customer rates meals and offers\"]:::act\n    U --> V\n    J --> W([End]):::stop\n    V --> X[\"Manager reviews sales and ratings report\"]:::sys\n    X --> W\n", "seq-manager": "sequenceDiagram\n    autonumber\n    actor M as manager\n    participant API as Laravel API\n    participant DB as Database\n\n    M->>API: POST /api/auth/login\n    API-->>M: 200 token (user_type=Manager)\n    M->>API: POST /api/employees (first_name, last_name, position, salary, bonus)\n    API->>DB: create user (user_type=Employee) + employee record\n    API-->>M: 201 employee created\n    M->>API: POST /api/meals (name, prep_time, category_id, percentage)\n    M->>API: POST /api/meals/:id/ingredients (ingredient_id, quantity)[]\n    API->>DB: sync ingredient_meal recipe\n    API-->>M: 200 meal saved, sellingPrice computed\n    M->>API: POST /api/offers (title, discount_amount, start_date, end_date)\n    M->>API: POST /api/offers/:id/meals (meal_id, quantity)[]\n    API->>DB: sync meal_offer bundle\n    API-->>M: 201 offer created\n    M->>API: POST /api/maintenances (maintenance_item, price, discount)\n    API->>DB: total_price = price - discount%\n    API-->>M: 201 maintenance logged\n    M->>API: GET /api/reports/ratings?type=meal\n    API-->>M: 200 average stars per meal\n", "seq-chef": "sequenceDiagram\n    autonumber\n    actor C as chef\n    participant API as Laravel API\n    participant DB as Database\n\n    C->>API: POST /api/auth/login\n    API-->>C: 200 token (position=Chef)\n    C->>API: GET /api/orders?status=Confirmed\n    API-->>C: 200 kitchen queue with meal_order lines\n    loop for each order line\n        C->>API: GET /api/meals/:id/ingredients\n        API-->>C: 200 recipe with ingredient stock_quantity\n        alt ingredient stock_quantity too low\n            C->>API: PATCH /api/meals/:id (availability=unavailable)\n            API->>DB: update meals.availability\n            API-->>C: 200 meal hidden from menu\n        else enough stock\n            C->>API: PATCH /api/meal-order/:id (prepared=true)\n            API->>DB: mark line prepared\n        end\n    end\n    C->>API: PATCH /api/orders/:id (status=Confirmed, ready_for_service)\n    API-->>C: 200 order handed to waiter or delivery\n", "seq-waiter": "sequenceDiagram\n    autonumber\n    actor W as waiter\n    participant API as Laravel API\n    participant DB as Database\n\n    W->>API: POST /api/auth/login\n    API-->>W: 200 token (position=Waiter)\n    W->>API: GET /api/reservations?date=today\n    API-->>W: 200 today's reservations\n    alt app reservation (type=Application)\n        W->>API: PATCH /api/reservations/:id (status=Confirmed)\n    else walk-in guest\n        W->>API: POST /api/reservations (type=Locally, party_size, employee_id=self)\n        API-->>W: 201 reservation Pending\n        W->>API: PATCH /api/reservations/:id (status=Confirmed)\n    end\n    W->>API: POST /api/reservations/:id/tables (table_id, start_time, end_time)\n    API->>DB: create reservation_table row\n    API-->>W: 200 table assigned\n    W->>API: POST /api/orders (order_type=Reservation, reservation_id, customer_id)\n    API-->>W: 201 order Pending\n    loop guest keeps ordering\n        W->>API: POST /api/orders/:id/meals (meal_id, quantity, notes)\n        W->>API: POST /api/orders/:id/offers (offer_id, quantity)\n    end\n    API->>DB: sync meal_order and offer_order lines\n    W->>API: PATCH /api/orders/:id (status=Confirmed)\n    Note over W,API: chef prepares in the kitchen\n    W->>API: PATCH /api/orders/:id (status=Completed)\n    API->>DB: order + reservation status=Completed\n    API-->>W: 200 table freed\n", "seq-delivery": "sequenceDiagram\n    autonumber\n    actor D as delivery\n    participant API as Laravel API\n    participant DB as Database\n\n    D->>API: POST /api/auth/login\n    API-->>D: 200 token (position=Delivery)\n    D->>API: GET /api/orders?order_type=Delivery&employee_id=self\n    API-->>D: 200 assigned delivery orders with location and delivery_time\n    D->>API: PATCH /api/orders/:id (status=Confirmed)\n    Note over D: picked up from kitchen, en route\n    alt delivered successfully\n        D->>API: PATCH /api/orders/:id (status=Completed)\n        API->>DB: update orders.status\n        API-->>D: 200 delivery closed\n    else customer unreachable\n        D->>API: PATCH /api/orders/:id (status=Cancelled, notes)\n        API->>DB: update orders.status, notes\n        API-->>D: 200 delivery cancelled\n    end\n", "seq-security": "sequenceDiagram\n    autonumber\n    actor S as security\n    participant API as Laravel API\n    participant DB as Database\n\n    S->>API: POST /api/auth/login\n    API-->>S: 200 token (position=Security)\n    S->>API: GET /api/reservations?reservation_code=...\n    API-->>S: 200 reservation with customer and party_size\n    S->>API: GET /api/customers/:id (ban, ban_date)\n    alt customer banned\n        API-->>S: 200 ban=true\n        S->>API: POST /api/incidents (note: entry denied, escalate to manager)\n        API-->>S: 201 logged\n    else customer in good standing\n        API-->>S: 200 ban=false\n        S->>API: GET /api/tables/:id (capacity)\n        alt party_size within capacity\n            API-->>S: 200 capacity ok\n            S-->>S: allow entry\n        else party_size exceeds capacity\n            API-->>S: 200 capacity insufficient\n            S->>API: GET /api/tables?location=&capacity_gte=party_size\n            API-->>S: 200 alternative tables\n        end\n    end\n", "seq-customer": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    participant API as Laravel API\n    participant DB as Database\n\n    CU->>API: POST /api/auth/login\n    API-->>CU: 200 token (user_type=Customer)\n    CU->>API: GET /api/categories\n    CU->>API: GET /api/meals?category_id=&is_vegetarian=\n    CU->>API: GET /api/offers?is_active=true\n    API-->>CU: 200 menu and active offers with computed prices\n    alt dine in\n        CU->>API: GET /api/tables/available?date=&party_size=\n        CU->>API: POST /api/reservations (type=Application, party_size, date)\n        API->>DB: create reservation status=Pending\n        API-->>CU: 201 reservation Pending\n    else delivery or takeaway\n        CU->>API: POST /api/orders (order_type=Delivery|Takeaway)\n        CU->>API: POST /api/orders/:id/meals (meal_id, quantity)\n        CU->>API: POST /api/orders/:id/offers (offer_id, quantity)\n        API->>DB: sync meal_order, offer_order\n        API-->>CU: 201 order Pending\n    end\n    CU->>API: GET /api/orders/:id (poll status)\n    API-->>CU: 200 status=Completed\n    CU->>API: POST /api/meals/:id/ratings (number_stars)\n    CU->>API: POST /api/offers/:id/ratings (number_stars)\n    API->>DB: insert meals_ratings / offers_ratings\n    API-->>CU: 201 thank you for rating\n", "seq-guest": "sequenceDiagram\n    autonumber\n    actor G as guest\n    participant API as Laravel API\n    participant DB as Database\n\n    G->>API: GET /api/categories\n    G->>API: GET /api/meals?category_id=\n    G->>API: GET /api/offers?is_active=true\n    API-->>G: 200 public menu and active offers\n    G->>API: GET /api/meals/:id/ratings/average\n    G->>API: GET /api/offers/:id/ratings/average\n    API-->>G: 200 average number_stars\n    G->>API: POST /api/register (first_name, last_name, email, password, phone, gender)\n    API->>DB: create user (user_type=Customer) + customer record\n    API-->>G: 201 verification email sent\n    G->>API: GET /api/email/verify/:id/:hash\n    API->>DB: set email_verified_at\n    API-->>G: 200 account Active, now a customer\n", "seq-e2e-delivery": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    actor C as chef\n    actor D as delivery\n    participant API as Laravel API\n    participant DB as Database\n\n    CU->>API: POST /api/orders (order_type=Delivery, location_id)\n    API->>DB: order status=Pending\n    API-->>CU: 201 order Pending\n    CU->>API: POST /api/orders/:id/meals (meal_id, quantity)[]\n    API->>DB: sync meal_order lines\n    C->>API: GET /api/orders?status=Pending&order_type=Delivery\n    API-->>C: 200 new delivery order\n    C->>API: PATCH /api/orders/:id (status=Confirmed)\n    API->>DB: assign employee_id (position=Delivery)\n    D->>API: GET /api/orders?order_type=Delivery&employee_id=self\n    API-->>D: 200 order with location.delivery_time\n    D->>API: GET /api/orders/:id (pickup from kitchen)\n    alt delivered on time\n        D->>API: PATCH /api/orders/:id (status=Completed)\n        API-->>D: 200 delivery closed\n    else customer unreachable\n        D->>API: PATCH /api/orders/:id (status=Cancelled, notes)\n        API-->>D: 200 delivery cancelled\n    end\n    CU->>API: GET /api/orders/:id\n    API-->>CU: 200 final status\n", "seq-e2e-maintenance": "sequenceDiagram\n    autonumber\n    actor E as employee\n    actor M as manager\n    participant API as Laravel API\n    participant DB as Database\n\n    E->>M: reports a facility issue (in person / phone)\n    M->>API: POST /api/maintenances (maintenance_item, price, discount, employee_id)\n    API->>DB: total_price = price - (price * discount / 100)\n    API-->>M: 201 maintenance logged\n    Note over M: table or equipment marked out of service if needed\n    M->>API: PATCH /api/tables/:id (is_active=false)\n    API->>DB: table removed from booking rotation\n    Note over M: repair completed\n    M->>API: PATCH /api/tables/:id (is_active=true)\n    API-->>M: 200 table back in rotation\n    M->>API: GET /api/reports/maintenance?range=month\n    API-->>M: 200 total maintenance cost for the period\n", "seq-e2e-offer-redemption": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    participant API as Laravel API\n    participant DB as Database\n\n    CU->>API: GET /api/offers?is_active=true\n    API->>DB: filter is_active=true and today between start_date/end_date\n    API-->>CU: 200 active offers with bundled meals (meal_offer)\n    CU->>API: GET /api/offers/:id\n    API-->>CU: 200 offer detail, bundlePrice computed from meal sellingPrice minus discount_amount%\n    CU->>API: POST /api/orders (order_type=Takeaway)\n    CU->>API: POST /api/orders/:id/offers (offer_id, quantity)\n    API->>DB: create offer_order line\n    alt offer expired between browse and checkout\n        API-->>CU: 422 offer is no longer active\n    else still active\n        API->>DB: order total recomputed with the discount\n        API-->>CU: 201 order confirmed with offer applied\n    end\n    Note over CU,API: after pickup, order marked Completed\n    CU->>API: POST /api/offers/:id/ratings (number_stars)\n    API->>DB: insert offers_ratings\n    API-->>CU: 201 thanks for rating the offer\n", "seq-e2e-ordering-dinein": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    actor W as waiter\n    actor C as chef\n    participant API as Laravel API\n    participant DB as Database\n\n    CU->>API: POST /api/reservations (type=Application, party_size, date)\n    API->>DB: reservation status=Pending\n    API-->>CU: 201 reservation Pending\n    W->>API: PATCH /api/reservations/:id (status=Confirmed)\n    W->>API: POST /api/reservations/:id/tables (table_id, start_time, end_time)\n    API->>DB: reservation_table row created\n    Note over CU,W: guests arrive, security verifies reservation_code\n    W->>API: POST /api/orders (order_type=Reservation, reservation_id, customer_id)\n    API-->>W: 201 order Pending\n    W->>API: POST /api/orders/:id/meals (meal_id, quantity)[]\n    API->>DB: sync meal_order lines\n    W->>API: PATCH /api/orders/:id (status=Confirmed)\n    C->>API: GET /api/orders?status=Confirmed\n    API-->>C: 200 kitchen queue includes this order\n    C->>API: PATCH /api/meal-order/:id (prepared=true)\n    C->>API: PATCH /api/orders/:id (ready_for_service=true)\n    W->>API: PATCH /api/orders/:id (status=Completed)\n    API->>DB: order + reservation status=Completed\n    API-->>W: 200 table freed for the next booking\n", "seq-e2e-rating": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    actor C as chef\n    actor M as manager\n    participant API as Laravel API\n    participant DB as Database\n\n    Note over CU,API: order already status=Completed\n    CU->>API: POST /api/meals/:id/ratings (number_stars)\n    API->>DB: insert meals_ratings (unique per meal + customer)\n    CU->>API: POST /api/offers/:id/ratings (number_stars)\n    API->>DB: insert offers_ratings\n    API-->>CU: 201 ratings recorded\n    M->>API: GET /api/reports/ratings?type=meal&sort=asc\n    API-->>M: 200 lowest rated meals first\n    alt meal consistently rated low\n        M->>C: ask kitchen to review the recipe\n        C->>API: PATCH /api/meals/:id (description, ingredients updated)\n    else meal performing well\n        M->>API: GET /api/reports/ratings?type=offer\n        API-->>M: 200 best performing offers\n    end\n", "seq-e2e-reservation": "sequenceDiagram\n    autonumber\n    actor CU as customer\n    actor W as waiter\n    actor S as security\n    participant API as Laravel API\n    participant DB as Database\n\n    CU->>API: GET /api/tables/available?date=&party_size=\n    API-->>CU: 200 available tables and time slots\n    CU->>API: POST /api/reservations (type=Application, party_size, date, special_requests)\n    API->>DB: reservation status=Pending, reservation_code generated\n    API-->>CU: 201 reservation_code\n    W->>API: GET /api/reservations?status=Pending\n    API-->>W: 200 pending list\n    W->>API: PATCH /api/reservations/:id (status=Confirmed)\n    W->>API: POST /api/reservations/:id/tables (table_id, start_time, end_time)\n    API->>DB: reservation_table row created\n    Note over CU: guests travel to the restaurant\n    CU->>S: shows reservation_code at the entrance\n    S->>API: GET /api/reservations?reservation_code=...\n    API-->>S: 200 reservation + customer.ban + party_size\n    alt banned or over capacity\n        S-->>CU: entry denied\n    else clear to enter\n        S-->>W: guests approved, seat them\n        W->>API: PATCH /api/reservations/:id (checked_in via order creation)\n    end\n", "seq-e2e-staff-onboarding": "sequenceDiagram\n    autonumber\n    actor M as manager\n    actor NE as new employee\n    participant API as Laravel API\n    participant DB as Database\n\n    M->>API: POST /api/employees (first_name, last_name, email, phone, gender, position)\n    API->>DB: create user (user_type=Employee, status=false)\n    API->>DB: create employee (national_id, position, salary, bonus, hire_date, birth_date)\n    API-->>M: 201 employee created, temporary password issued\n    M->>API: PATCH /api/users/:id (location_id)\n    API-->>M: 200 assigned to a location\n    NE->>API: POST /api/auth/login (temporary password)\n    API-->>NE: 200 token\n    NE->>API: PATCH /api/auth/password (new password)\n    API->>DB: update password, password hashed\n    M->>API: PATCH /api/users/:id (status=true)\n    API-->>M: 200 account Active\n    alt position=Chef\n        NE->>API: GET /api/orders?status=Confirmed\n    else position=Waiter\n        NE->>API: GET /api/reservations?date=today\n    else position=Delivery\n        NE->>API: GET /api/orders?order_type=Delivery&employee_id=self\n    else position=Security\n        NE->>API: GET /api/reservations?reservation_code=\n    end\n", "st-customer-account": "stateDiagram-v2\n    direction LR\n    [*] --> PendingVerification: POST /api/register (user_type=Customer)\n    PendingVerification --> Active: email_verified_at set\n    Active --> Banned: manager sets ban=true, ban_date recorded\n    Banned --> Active: manager sets ban=false, ban_date cleared\n    Active --> [*]\n    note right of Banned\n        security checks ban status at the door;\n        banned customers cannot open new orders\n    end note\n", "st-meal": "stateDiagram-v2\n    direction LR\n    [*] --> Available: meal created with availability=available\n    Available --> Unavailable: chef marks it out (ingredient stock_quantity too low)\n    Unavailable --> Available: ingredients.stock_quantity restocked, chef re-enables\n    Available --> [*]: meal removed from the menu\n    note right of Unavailable\n        hidden from the customer menu and from\n        new meal_order / meal_offer lines\n    end note\n", "st-offer": "stateDiagram-v2\n    direction LR\n    [*] --> Scheduled: created with start_date in the future\n    Scheduled --> Active: start_date reached and is_active=true\n    Active --> Expired: end_date passed\n    Active --> Disabled: manager sets is_active=false\n    Disabled --> Active: manager re-enables within the date range\n    Disabled --> Expired: end_date passes while disabled\n    Expired --> [*]\n    note right of Active\n        only Active offers are returned to customers\n        and can be attached to a new offer_order line\n    end note\n", "st-order": "stateDiagram-v2\n    direction LR\n    [*] --> Pending: POST /api/orders (meals, offers, order_type)\n    Pending --> Confirmed: employee accepts / kitchen starts prep\n    Pending --> Cancelled: PATCH cancel before prep starts\n    Confirmed --> Completed: PATCH status=Completed (served or delivered)\n    Confirmed --> Cancelled: PATCH cancel + notes (kitchen issue, no stock)\n    Completed --> [*]\n    Cancelled --> [*]\n    note right of Confirmed\n        Delivery orders require employee_id\n        (position Delivery) before Confirmed\n    end note\n    note right of Completed\n        soft deleted afterwards is a\n        separate archival action, not a status\n    end note\n", "st-reservation": "stateDiagram-v2\n    direction LR\n    [*] --> Pending: POST /api/reservations (type=Application or Locally)\n    Pending --> Confirmed: waiter/manager confirms + attaches table via reservation_table\n    Pending --> Cancelled: customer or staff cancels before the date\n    Confirmed --> Completed: converted into an order at check-in\n    Confirmed --> Cancelled: cancelled before arrival\n    Completed --> [*]\n    Cancelled --> [*]\n    note right of Confirmed\n        type=Locally is confirmed immediately\n        by the employee who took the booking\n    end note\n    note right of Completed\n        order_id is set on the reservation\n        once the dine-in order is opened\n    end note\n", "st-table": "stateDiagram-v2\n    direction LR\n    [*] --> Free\n    Free --> Reserved: reservation_table row created for a future slot\n    Reserved --> Occupied: start_time reached, guests seated\n    Occupied --> Cleaning: end_time reached / guests leave\n    Cleaning --> Free: cleared for the next booking\n    Free --> OutOfService: manager sets is_active=false\n    OutOfService --> Free: manager sets is_active=true\n    note right of Reserved\n        several reservation_table rows can queue\n        on the same table for different time slots\n    end note\n    note right of OutOfService\n        table removed from booking rotation,\n        logged separately in maintenances by item name\n    end note\n"}, META = {"erd-core": {"title": "Database — ERD — Core tables", "group": "Database"}, "erd": {"title": "Database — ERD — Full schema", "group": "Database"}, "classes-catalog": {"title": "Domain Model — Classes — Menu catalog", "group": "Domain Model"}, "classes-core": {"title": "Domain Model — Classes — Core", "group": "Domain Model"}, "classes": {"title": "Domain Model — Classes — Full", "group": "Domain Model"}, "uc-manager": {"title": "Use Cases — manager — Manager", "group": "Use Cases"}, "uc-chef": {"title": "Use Cases — chef — Chef", "group": "Use Cases"}, "uc-waiter": {"title": "Use Cases — waiter — Waiter", "group": "Use Cases"}, "uc-delivery": {"title": "Use Cases — delivery — Delivery", "group": "Use Cases"}, "uc-security": {"title": "Use Cases — security — Security", "group": "Use Cases"}, "uc-customer": {"title": "Use Cases — customer — Customer", "group": "Use Cases"}, "uc-guest": {"title": "Use Cases — guest — Guest (unregistered)", "group": "Use Cases"}, "uc-system": {"title": "Use Cases — System overview — all actors", "group": "Use Cases"}, "act-manager": {"title": "Activity — manager — Manager", "group": "Activity"}, "act-chef": {"title": "Activity — chef — Chef", "group": "Activity"}, "act-waiter": {"title": "Activity — waiter — Waiter", "group": "Activity"}, "act-delivery": {"title": "Activity — delivery — Delivery", "group": "Activity"}, "act-security": {"title": "Activity — security — Security", "group": "Activity"}, "act-customer": {"title": "Activity — customer — Customer", "group": "Activity"}, "act-guest": {"title": "Activity — guest — Guest (unregistered)", "group": "Activity"}, "act-full-flow": {"title": "Activity — End to end flow — all roles", "group": "Activity"}, "seq-manager": {"title": "Sequence by Role — manager — Manager", "group": "Sequence by Role"}, "seq-chef": {"title": "Sequence by Role — chef — Chef", "group": "Sequence by Role"}, "seq-waiter": {"title": "Sequence by Role — waiter — Waiter", "group": "Sequence by Role"}, "seq-delivery": {"title": "Sequence by Role — delivery — Delivery", "group": "Sequence by Role"}, "seq-security": {"title": "Sequence by Role — security — Security", "group": "Sequence by Role"}, "seq-customer": {"title": "Sequence by Role — customer — Customer", "group": "Sequence by Role"}, "seq-guest": {"title": "Sequence by Role — guest — Guest (unregistered)", "group": "Sequence by Role"}, "seq-e2e-delivery": {"title": "Sequence — Scenarios — Delivery order end to end", "group": "Sequence — Scenarios"}, "seq-e2e-maintenance": {"title": "Sequence — Scenarios — Facility maintenance", "group": "Sequence — Scenarios"}, "seq-e2e-offer-redemption": {"title": "Sequence — Scenarios — Offer browsing and redemption", "group": "Sequence — Scenarios"}, "seq-e2e-ordering-dinein": {"title": "Sequence — Scenarios — Dine-in ordering end to end", "group": "Sequence — Scenarios"}, "seq-e2e-rating": {"title": "Sequence — Scenarios — Ratings feeding the menu report", "group": "Sequence — Scenarios"}, "seq-e2e-reservation": {"title": "Sequence — Scenarios — Reservation and entrance check", "group": "Sequence — Scenarios"}, "seq-e2e-staff-onboarding": {"title": "Sequence — Scenarios — New employee onboarding", "group": "Sequence — Scenarios"}, "st-customer-account": {"title": "State Machines — Customer account", "group": "State Machines"}, "st-meal": {"title": "State Machines — Meal availability", "group": "State Machines"}, "st-offer": {"title": "State Machines — Offer lifecycle", "group": "State Machines"}, "st-order": {"title": "State Machines — Order status", "group": "State Machines"}, "st-reservation": {"title": "State Machines — Reservation status", "group": "State Machines"}, "st-table": {"title": "State Machines — Table occupancy", "group": "State Machines"}};
let current = 'erd-core', zoom = 1;
const theme = () => document.documentElement.getAttribute('data-theme');
function initM(){
  mermaid.initialize({startOnLoad:false, theme: theme()==='dark'?'dark':'default',
    themeVariables: theme()==='dark'
      ? {primaryColor:'#1e293b',primaryTextColor:'#f8fafc',primaryBorderColor:'#fb923c',
         lineColor:'#94a3b8',fontFamily:'Poppins, sans-serif'}
      : {primaryColor:'#fff7ed',primaryTextColor:'#0f172a',primaryBorderColor:'#ea580c',
         lineColor:'#64748b',fontFamily:'Poppins, sans-serif'},
    er:{useMaxWidth:false,entityPadding:12,minEntityWidth:130},
    class:{useMaxWidth:false}, sequence:{useMaxWidth:false,wrap:true,width:230},
    state:{useMaxWidth:false},
    flowchart:{useMaxWidth:false,curve:'basis',padding:14}});
}
async function render(k){
  current=k;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===k));
  document.getElementById('pTitle').textContent=META[k].title;
  const c=document.getElementById('canvas');
  c.innerHTML='<div style="padding:40px;color:#64748b">Rendering...</div>';
  try{ const {svg}=await mermaid.render('g'+Date.now(),SOURCES[k]); c.innerHTML=svg; applyZoom(); }
  catch(e){ c.innerHTML='<pre style="color:#dc2626;padding:20px;white-space:pre-wrap">'+e.message+'</pre>'; }
}
function applyZoom(){const s=document.querySelector('#canvas svg');
  if(s){s.style.transformOrigin='top left';s.style.transform='scale('+zoom+')';}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{zoom=1;render(t.dataset.k);}));
document.getElementById('zi').onclick=()=>{zoom=Math.min(zoom+.15,3);applyZoom();};
document.getElementById('zo').onclick=()=>{zoom=Math.max(zoom-.15,.35);applyZoom();};
document.getElementById('dl').onclick=()=>{const s=document.querySelector('#canvas svg');if(!s)return;
  const b=new Blob([s.outerHTML],{type:'image/svg+xml'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=current+'.svg';a.click();};
document.getElementById('th').onclick=()=>{const n=theme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  document.getElementById('th').textContent=n==='dark'?'Light mode':'Dark mode';initM();render(current);};
initM();render(current);
</script>
